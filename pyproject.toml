[project]
name = "statement"
version = "0.1.0"
description = "Test project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.139.0",
    "faststream[rabbit]>=0.7.2",
    "httpx>=0.28.1",
    "pgqueuer[asyncpg]>=1.1.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
]

[project.scripts]
statement-token = "statement.infra.local_auth:main"

[tool.fastapi]
entrypoint = "statement.main:app"

[tool.pytest.ini_options]
log_level = "WARNING"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# asyncpg publishes no type information (no py.typed marker)
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# vendored from SQLAlchemy's versioned_history example: mapper metaprogramming
# mypy cannot follow; only its public surface (versioned_session) is typed
module = "statement.persistence.versioned_history"
ignore_errors = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[build-system]
requires = ["uv_build>=0.12.00,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
