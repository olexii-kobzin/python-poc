name: Checks and tests
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-n-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7
    - name: Build Docker image
      run: docker image build --file ./cicd/docker/Dockerfile --target test --tag statement-test .
    - name: Create Docker container
      run: docker container run --name statement-test-c statement-test
    - name: Run mypy
      run: docker container run statement-test-c uv run mypy src tests
    - name: Run ruff
      run: docker container run statement-test-c uv run ruff check
    - name: Run tests
      run: docker container run statement-test-c uv run pytest
